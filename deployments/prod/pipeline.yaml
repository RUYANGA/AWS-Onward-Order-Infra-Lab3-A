# GitSync deployment file for stack onward-prod-pipeline
template-file-path: templates/pipeline.yaml
parameters:
  Project: onward
  Environment: prod
  Owner: Merci RUYANGA
  DeploymentConfig: CodeDeployDefault.ECSAllAtOnce
  KeepOldVersionMinutes: 5
  # Every production release waits for a person to approve it in CodePipeline.
  RequireReleaseApproval: "true"
  # Optional: set an address to be emailed when a release is waiting (confirm the SNS email once).
  ApprovalNotificationEmail: ""
tags:
  Project: onward
  Environment: prod
  Owner: Merci RUYANGA
  ManagedBy: cloudformation-gitsync
