# GitSync deployment file for stack onward-prod-gitsync-bootstrap-Lab3-A.
# The bootstrap creates the sync configurations for the other stacks, so raising
# SyncStage here (by pull request) is how each stack is switched on:
#   1 = network, 2 = + delivery-foundation, 3 = + service, 4 = + pipeline.
# Push the first app image (Build and release) between 2 and 3.
# GitSync only updates existing stacks: before raising SyncStage to a stack, create
# it from templates/gitsync-placeholder.yaml with the stack name below:
#   1 onward-prod-network-Lab3-A        2 onward-prod-delivery-foundation-Lab3-A
#   3 onward-prod-service-Lab3-A        4 onward-prod-pipeline-Lab3-A
template-file-path: templates/bootstrap-gitsync.yaml
parameters:
  Project: onward
  Environment: prod
  Owner: Merci RUYANGA
  GitHubOwner: RUYANGA
  InfraRepositoryName: AWS-Onward-Order-Infra-Lab3-A
  Branch: main
  # Created in the console before the first sync (GitSync cannot create its own
  # connection and repository link). Fill both before setting SyncStage to 1.
  ExistingConnectionArn: "arn:aws:codeconnections:eu-west-1:266735846670:connection/4573cbec-8db6-428b-89b9-5d1bb1c7d597"
  ExistingRepositoryLinkId: "a8f9dc13-7b59-4f74-b191-5416bf12506a"
  SyncStage: "3"
tags:
  Project: onward
  Environment: prod
  Owner: Merci RUYANGA
  ManagedBy: cloudformation-gitsync
