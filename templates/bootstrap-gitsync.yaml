AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics - GitSync bootstrap. Deployed ONCE from the CLI; everything
  else is deployed by CloudFormation GitSync from this repository. Creates the
  GitHub connection, the repository link, the role GitSync uses, and one sync
  configuration per stack. Raise SyncStage one step at a time so each stack
  exists before the stacks that import its outputs.

Parameters:
  Project:
    Type: String
    Default: onward
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: prod
  Owner:
    Type: String
    Default: Merci RUYANGA
  GitHubOwner:
    Type: String
  InfraRepositoryName:
    Type: String
    Default: AWS-Onward-Order-Infra-Lab3-A
  Branch:
    Type: String
    Default: main
  ExistingConnectionArn:
    Type: String
    Default: "arn:aws:codeconnections:eu-west-1:266735846670:connection/2101d368-9af9-452b-a5a9-8b5e1fdd0213"
    Description: Reuse an existing, AVAILABLE CodeConnections GitHub connection instead of creating one.
  SyncStage:
    Type: String
    AllowedValues: ["0", "1", "2", "3", "4"]
    Default: "4"
    Description: >-
      0 = connection only (authorise it, see README). 1 = + network.
      2 = + delivery-foundation. 3 = + service. 4 = + pipeline.

Conditions:
  CreateConnection: !Equals [!Ref ExistingConnectionArn, ""]
  Stage1: !Or [!Equals [!Ref SyncStage, "1"], !Equals [!Ref SyncStage, "2"], !Equals [!Ref SyncStage, "3"], !Equals [!Ref SyncStage, "4"]]
  Stage2: !Or [!Equals [!Ref SyncStage, "2"], !Equals [!Ref SyncStage, "3"], !Equals [!Ref SyncStage, "4"]]
  Stage3: !Or [!Equals [!Ref SyncStage, "3"], !Equals [!Ref SyncStage, "4"]]
  Stage4: !Equals [!Ref SyncStage, "4"]

Resources:
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Condition: CreateConnection
    Properties:
      ConnectionName: !Sub "${Project}-${Environment}-github"
      ProviderType: GitHub
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  RepositoryLink:
    Type: AWS::CodeStarConnections::RepositoryLink
    Condition: Stage1
    Properties:
      ConnectionArn: !If [CreateConnection, !Ref GitHubConnection, !Ref ExistingConnectionArn]
      OwnerId: !Ref GitHubOwner
      RepositoryName: !Ref InfraRepositoryName
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  # Permissions GitSync itself needs (customer-managed, not inline).
  GitSyncPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Project}-${Environment}-gitsync"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StackOperations
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:ListChangeSets
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
            Resource: "*"
          - Sid: SyncEventRules
            Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
              - events:DeleteRule
              - events:DescribeRule
              - events:RemoveTargets
            Resource: !Sub "arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/AWSCloudFormationManaged*"
            Condition:
              StringEquals:
                events:ManagedBy: cloudformation.sync.codeconnections.amazonaws.com

  # GitSync creates the stacks with this role, so it also needs rights to build
  # the resources in templates/. Tighten to service-specific policies for real prod.
  GitSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Environment}-gitsync"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.sync.codeconnections.amazonaws.com
                - cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref GitSyncPolicy
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/IAMFullAccess"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  NetworkSync:
    Type: AWS::CodeStarConnections::SyncConfiguration
    Condition: Stage1
    Properties:
      SyncType: CFN_STACK_SYNC
      ResourceName: !Sub "${Project}-${Environment}-network"
      RepositoryLinkId: !GetAtt RepositoryLink.RepositoryLinkId
      Branch: !Ref Branch
      ConfigFile: !Sub "deployments/${Environment}/network.yaml"
      RoleArn: !GetAtt GitSyncRole.Arn
      PublishDeploymentStatus: ENABLED
      TriggerResourceUpdateOn: FILE_CHANGE

  FoundationSync:
    Type: AWS::CodeStarConnections::SyncConfiguration
    Condition: Stage2
    Properties:
      SyncType: CFN_STACK_SYNC
      ResourceName: !Sub "${Project}-${Environment}-delivery-foundation"
      RepositoryLinkId: !GetAtt RepositoryLink.RepositoryLinkId
      Branch: !Ref Branch
      ConfigFile: !Sub "deployments/${Environment}/delivery-foundation.yaml"
      RoleArn: !GetAtt GitSyncRole.Arn
      PublishDeploymentStatus: ENABLED
      TriggerResourceUpdateOn: FILE_CHANGE

  ServiceSync:
    Type: AWS::CodeStarConnections::SyncConfiguration
    Condition: Stage3
    Properties:
      SyncType: CFN_STACK_SYNC
      ResourceName: !Sub "${Project}-${Environment}-service"
      RepositoryLinkId: !GetAtt RepositoryLink.RepositoryLinkId
      Branch: !Ref Branch
      ConfigFile: !Sub "deployments/${Environment}/service.yaml"
      RoleArn: !GetAtt GitSyncRole.Arn
      PublishDeploymentStatus: ENABLED
      TriggerResourceUpdateOn: FILE_CHANGE

  PipelineSync:
    Type: AWS::CodeStarConnections::SyncConfiguration
    Condition: Stage4
    Properties:
      SyncType: CFN_STACK_SYNC
      ResourceName: !Sub "${Project}-${Environment}-pipeline"
      RepositoryLinkId: !GetAtt RepositoryLink.RepositoryLinkId
      Branch: !Ref Branch
      ConfigFile: !Sub "deployments/${Environment}/pipeline.yaml"
      RoleArn: !GetAtt GitSyncRole.Arn
      PublishDeploymentStatus: ENABLED
      TriggerResourceUpdateOn: FILE_CHANGE

Outputs:
  ConnectionArn:
    Description: Authorise this connection once (see README step 2).
    Value: !If [CreateConnection, !Ref GitHubConnection, !Ref ExistingConnectionArn]
  GitSyncRoleArn:
    Value: !GetAtt GitSyncRole.Arn
