AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics order system - service layer. Internet-facing ALB (the single
  public entry point), two target groups for blue/green, an ECS Fargate service
  in private subnets across two AZs, CPU-based auto scaling, and the alarms
  CodeDeploy watches to roll a bad release back automatically.

Parameters:
  Project:
    Type: String
    Default: onward
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: prod
  Owner:
    Type: String
  CostCenter:
    Type: String
  ContainerName:
    Type: String
    Default: order-app
  ContainerPort:
    Type: Number
    Default: 8000
  ImageTag:
    Type: String
    Default: latest
    Description: Only used when the stack is first created. After that CodeDeploy owns the running image.
  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]
  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
  DesiredCount:
    Type: Number
    Default: 2
  MinCapacity:
    Type: Number
    Default: 2
    Description: Never below 2 in prod so one task survives in each AZ.
  MaxCapacity:
    Type: Number
    Default: 6
  CpuTargetPercent:
    Type: Number
    Default: 50
  HealthCheckPath:
    Type: String
    Default: /health
  LogRetentionDays:
    Type: Number
    Default: 14
  OffHoursShutdown:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Scale to zero at night and weekends (use for dev, never for prod).

Conditions:
  ScheduleShutdown: !Equals [!Ref OffHoursShutdown, "true"]

Resources:
  # ------------------------------------------------------------------ Logging
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${Project}-${Environment}-order-app"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation-gitsync

  # ---------------------------------------------------------------------- IAM
  # AWS-managed policies only (no inline policies).
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Environment}-ecs-execution"
      Description: Lets ECS pull the image from ECR and write logs - via the VPC endpoints.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation-gitsync

  # The application itself calls no AWS APIs, so its role has no permissions.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Environment}-ecs-task"
      Description: Identity of the running application. Intentionally has no permissions.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation-gitsync

  # ------------------------------------------------------------ Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${Project}-${Environment}-alb"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !ImportValue
          "Fn::Sub": "${Project}-${Environment}-PublicSubnet1Id"
        - !ImportValue
          "Fn::Sub": "${Project}-${Environment}-PublicSubnet2Id"
      SecurityGroups:
        - !ImportValue
          "Fn::Sub": "${Project}-${Environment}-AlbSecurityGroupId"
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      Tags:
        - Key: Name
          Value: !Sub "${Project}-${Environment}-alb"
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation-gitsync

  # Two identical target groups. CodeDeploy alternates between them on every
  # release: the live one is "blue", the one receiving the new version is "green".
  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Project}-${Environment}-tg-blue"
      VpcId: !ImportValue
        "Fn::Sub": "${Project}-${Environment}-VpcId"
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation-gitsync

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Project}-${Environment}-tg-green"
      VpcId: !ImportValue
        "Fn::Sub": "${Project}-${Environment}-VpcId"
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation-gitsync

  # Customers always use port 80. CodeDeploy rewrites this listener's target
  # group during a release; do not change it from CloudFormation afterwards.
  ProductionListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # Lets the new version be checked before customers see it (SG-restricted).
  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: !ImportValue
        "Fn::Sub": "${Project}-${Environment}-TestListenerPort"
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # ---------------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${Project}-${Environment}-cluster"
      CapacityProviders: [FARGATE]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation-gitsync

  # The first revision. Each release registers a new revision of this family
  # through CodeDeploy, using this one as its template (see the app repo).
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Project}-${Environment}-order-app"
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: tmp
      ContainerDefinitions:
        - Name: !Ref ContainerName
          Image: !Sub
            - "${RepoUri}:${ImageTag}"
            - RepoUri: !ImportValue
                "Fn::Sub": "${Project}-${Environment}-EcrRepositoryUri"
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints:
            - SourceVolume: tmp
              ContainerPath: /tmp
              ReadOnly: false
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: !Ref Environment
            - Name: PORT
              Value: !Ref ContainerPort
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${ContainerPort}${HealthCheckPath}', timeout=3)\" || exit 1"
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation-gitsync

  Service:
    Type: AWS::ECS::Service
    DependsOn: [ProductionListener, TestListener]
    Properties:
      ServiceName: !Sub "${Project}-${Environment}-order-svc"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentController:
        Type: CODE_DEPLOY        # releases are blue/green, run by CodeDeploy
      HealthCheckGracePeriodSeconds: 60
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              "Fn::Sub": "${Project}-${Environment}-PrivateSubnet1Id"
            - !ImportValue
              "Fn::Sub": "${Project}-${Environment}-PrivateSubnet2Id"
          SecurityGroups:
            - !ImportValue
              "Fn::Sub": "${Project}-${Environment}-AppSecurityGroupId"
      LoadBalancers:
        - ContainerName: !Ref ContainerName
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroup
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation-gitsync

  # ------------------------------------------------------------- Auto scaling
  # Uses the Application Auto Scaling service-linked role (created automatically).
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity
      ScheduledActions: !If
        - ScheduleShutdown
        -   - ScheduledActionName: !Sub "${Project}-${Environment}-evening-stop"
              Schedule: cron(0 18 ? * MON-FRI *)
              ScalableTargetAction:
                MinCapacity: 0
                MaxCapacity: 0
            - ScheduledActionName: !Sub "${Project}-${Environment}-morning-start"
              Schedule: cron(0 6 ? * MON-FRI *)
              ScalableTargetAction:
                MinCapacity: !Ref MinCapacity
                MaxCapacity: !Ref MaxCapacity
        - !Ref AWS::NoValue
  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${Project}-${Environment}-cpu-target-tracking"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CpuTargetPercent
        ScaleOutCooldown: 60     # add capacity quickly on busy days
        ScaleInCooldown: 180     # remove it more cautiously
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  # ------------------------------------------------- Release-safety alarms
  # CodeDeploy watches these during a release and rolls back if any fires.
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-${Environment}-target-5xx"
      AlarmDescription: The application is returning server errors.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  BlueUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-${Environment}-tg-blue-unhealthy"
      AlarmDescription: Unhealthy tasks behind the blue target group.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt BlueTargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  GreenUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-${Environment}-tg-green-unhealthy"
      AlarmDescription: Unhealthy tasks behind the green target group.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt GreenTargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApplicationUrl:
    Description: The single public address of the order application.
    Value: !Sub "http://${LoadBalancer.DNSName}"
  ClusterName:
    Value: !Ref Cluster
    Export:
      Name: !Sub "${Project}-${Environment}-ClusterName"
  ServiceName:
    Value: !GetAtt Service.Name
    Export:
      Name: !Sub "${Project}-${Environment}-ServiceName"
  TaskFamily:
    Value: !Sub "${Project}-${Environment}-order-app"
  ContainerName:
    Value: !Ref ContainerName
  ProductionListenerArn:
    Value: !Ref ProductionListener
    Export:
      Name: !Sub "${Project}-${Environment}-ProductionListenerArn"
  TestListenerArn:
    Value: !Ref TestListener
    Export:
      Name: !Sub "${Project}-${Environment}-TestListenerArn"
  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName
    Export:
      Name: !Sub "${Project}-${Environment}-BlueTargetGroupName"
  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName
    Export:
      Name: !Sub "${Project}-${Environment}-GreenTargetGroupName"
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub "${Project}-${Environment}-TaskExecutionRoleArn"
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub "${Project}-${Environment}-TaskRoleArn"
  Target5xxAlarmName:
    Value: !Ref Target5xxAlarm
    Export:
      Name: !Sub "${Project}-${Environment}-Target5xxAlarmName"
  BlueUnhealthyAlarmName:
    Value: !Ref BlueUnhealthyAlarm
    Export:
      Name: !Sub "${Project}-${Environment}-BlueUnhealthyAlarmName"
  GreenUnhealthyAlarmName:
    Value: !Ref GreenUnhealthyAlarm
    Export:
      Name: !Sub "${Project}-${Environment}-GreenUnhealthyAlarmName"
